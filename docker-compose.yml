services:
  postgres:
    image: postgres:16-alpine
    container_name: sgm-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgm
      POSTGRES_PASSWORD: sgm
      POSTGRES_DB: sgm_core
    ports:
      - "5432:5432"
    volumes:
      - sgm-core-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgm -d sgm_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sgm-core-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://sgm:sgm@postgres:5432/sgm_core?schema=public
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sgm-core-client
    restart: unless-stopped
    env_file:
      - ./client/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next

volumes:
  sgm-core-postgres-data:
